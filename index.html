<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Chi Tiêu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c5071c">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Chi Tiêu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css?v=8b94c7fb">
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-logo"><img src="icons/icon-192.png" alt="" width="84" height="84"></div>
    <h2>Sổ Chi Tiêu</h2>
    <p>Đăng nhập Google để đồng bộ dữ liệu qua Google Drive.</p>
    <button id="btnSignIn" class="btn">Đăng nhập với Google</button>
    <button id="btnOffline" class="btn secondary" style="display:none;margin-top:8px"></button>
    <div class="auth-msg" id="authMsg"></div>
    <div id="iosHint" class="ios-hint" style="display:none">
      <button id="iosHintDong" class="ios-hint-x" aria-label="Đóng gợi ý"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <b>Đưa lên màn hình chính cho tiện</b><br>
      Bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên ↑) ở thanh dưới Safari → <b>Thêm vào Màn hình chính</b>.
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="brand"><img class="brand-logo" src="icons/icon-192.png" alt="" width="28" height="28"> Sổ Chi Tiêu</div>
    <div class="sync-status" id="syncStatus">Đang tải dữ liệu…</div>
    <button id="btnPhimTat" aria-label="Phím tắt" title="Phím tắt (?)">?</button>
    <button id="btnTheme" aria-label="Đổi giao diện sáng/tối"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg></button>
    <button id="btnRefresh" aria-label="Làm mới"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span class="lbl"> Làm mới</span></button>
  </header>
  <div id="bannerZone"></div>
  <!-- Cùng 1 markup cho cả desktop và mobile: ở <=700px CSS đẩy .tabs xuống đáy
       (vùng ngón tay), .tab-ico hiện lên trên chữ. Handler ở app.js không đổi. -->
  <nav class="tabs">
    <button class="tab active" data-tab="sotay"><span class="tab-ico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v14H6.5A1.5 1.5 0 0 0 5 18.5z"/><path d="M5 18.5A1.5 1.5 0 0 0 6.5 20H19v-3"/><path d="M9 7h6"/></svg></span>Sổ tay</button>
    <button class="tab" data-tab="dongtien"><span class="tab-ico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 17l5.5-6 4 4L21 6"/><path d="M15 6h6v6"/></svg></span>Dòng tiền</button>
    <button class="tab" data-tab="vayno"><span class="tab-ico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v16"/><path d="M6.5 20h11"/><path d="M5 7h14"/><path d="M5 7l-2.5 6a3 3 0 0 0 5 0z"/><path d="M19 7l-2.5 6a3 3 0 0 0 5 0z"/></svg></span>Vay - Nợ<span class="tab-badge" id="vnBadge" style="display:none"></span></button>
    <button class="tab" data-tab="mophong"><span class="tab-ico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h9"/><path d="M17 7h3"/><circle cx="15" cy="7" r="2"/><path d="M4 17h3"/><path d="M11 17h9"/><circle cx="9" cy="17" r="2"/></svg></span>Mô phỏng</button>
    <button class="tab" data-tab="danhmuc"><span class="tab-ico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4.5 6h.01"/><path d="M4.5 12h.01"/><path d="M4.5 18h.01"/></svg></span>Danh mục</button>
  </nav>
  <main id="tabContent"><div class="empty">Đang tải…</div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="js/state.js?v=8b94c7fb"></script>
<script src="js/ui.js?v=8b94c7fb"></script>
<script src="js/drive-sync.js?v=8b94c7fb"></script>
<script src="js/vayno.js?v=8b94c7fb"></script>
<script src="js/sotay.js?v=8b94c7fb"></script>
<script src="js/nhap.js?v=8b94c7fb"></script>
<script src="js/danhmuc.js?v=8b94c7fb"></script>
<script src="js/dongtien.js?v=8b94c7fb"></script>
<script src="js/mophong.js?v=8b94c7fb"></script>
<script src="js/app.js?v=8b94c7fb"></script>

</body>
</html>
