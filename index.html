<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Chi Tiêu</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f7fb; --card:#ffffff; --border:#e5e7eb; --text:#1f2430; --muted:#6b7280;
  --primary:#4f46e5; --primary-d:#4338ca; --green:#16a34a; --red:#dc2626; --amber:#d97706; --gold:#b8860b;
  --thu-bg:#ecfdf5; --chi-bg:#fef2f2; --shadow:0 1px 2px rgba(0,0,0,.04), 0 1px 6px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
#app{max-width:1100px;margin:0 auto;padding:12px 14px 60px}
header{display:flex;align-items:center;gap:10px;padding:10px 2px 14px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:20}
.brand{font-size:18px;font-weight:700;color:var(--primary-d);margin-right:auto}
.sync-status{font-size:12px;color:var(--muted);white-space:nowrap}
.sync-status.err{color:var(--red)}
.sync-status.ok{color:var(--green)}
button{cursor:pointer;font-family:inherit}
#btnRefresh,#btnSignOut{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--text)}
#btnRefresh:hover,#btnSignOut:hover{background:#f0f1f5}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border);position:sticky;top:var(--header-h,52px);background:var(--bg);z-index:19}
.tab{background:none;border:none;padding:10px 16px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--primary-d);border-bottom-color:var(--primary)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px;color:var(--text)}
.grid-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat .val{font-size:17px;font-weight:700}
.stat.thu .val{color:var(--green)}
.stat.chi .val{color:var(--red)}
.stat.gold .val{color:var(--gold)}
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:calc(var(--header-h,52px) + var(--tabs-h,45px));background:var(--bg);z-index:18;padding-top:4px}
.month-nav button{background:var(--card);border:1px solid var(--border);border-radius:8px;width:30px;height:30px}
.month-nav .lbl{font-weight:700;font-size:15px;min-width:110px;text-align:center}
.month-nav select{font-weight:700;font-size:15px;border:1px solid var(--border);border-radius:8px;padding:5px 6px;background:#fff;color:var(--text);text-align:center;text-align-last:center}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input[type=number],input[type=date],input[type=text]{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;font-size:14px;background:#fff;color:var(--text)}
.form-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.cat-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:10px}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;color:#fff;background:var(--primary)}
.btn:hover{background:var(--primary-d)}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.secondary:hover{background:#f0f1f5}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}
.btn.danger:hover{background:var(--chi-bg)}
.btn.sm{padding:4px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.total-row td{font-weight:700;background:#f6f7fb}
tr.balance-row td{font-weight:700;background:#eef2ff;color:var(--primary-d)}
.table-wrap{overflow-x:auto}
.table-wrap-year{overflow:auto;max-height:65vh}
.table-wrap-year thead th{position:sticky;top:0;background:#fff;z-index:3}
.table-wrap-year thead th.sticky-col{z-index:4}
.actions-col{width:70px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.charts-grid .full{grid-column:1/-1}
@media (max-width:700px){.charts-grid{grid-template-columns:1fr}}
.chart-box{position:relative;height:230px}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.dt-input{width:150px;text-align:right}
.th-month{text-align:center}
.dt-suggest{font-style:italic;color:var(--muted)}
.cat-label{display:flex;align-items:center;gap:6px}
.cat-tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:#f0f1f5;color:var(--muted)}
.group-title{font-weight:700;margin:14px 0 6px;font-size:13px;color:var(--primary-d)}
.group-title:first-child{margin-top:0}
.icon-btn{background:none;border:none;color:var(--muted);font-size:15px;padding:2px 6px;border-radius:6px}
.icon-btn:hover{background:#f0f1f5;color:var(--red)}
.banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.year-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:calc(var(--header-h,52px) + var(--tabs-h,45px));background:var(--bg);z-index:18;padding-top:4px}
.year-nav .lbl{font-weight:700;font-size:15px;min-width:60px;text-align:center}
.sticky-col{position:sticky;left:0;background:#fff;z-index:2;box-shadow:2px 0 4px rgba(0,0,0,.05)}
tr.total-row .sticky-col{background:#f6f7fb}
tr.balance-row .sticky-col{background:#eef2ff}
.auth-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 26px;box-shadow:var(--shadow);max-width:320px;width:100%;text-align:center}
.auth-card .auth-logo{font-size:36px;margin-bottom:6px}
.auth-card h2{margin:0 0 8px;font-size:18px}
.auth-card p{color:var(--muted);font-size:13px;margin:0 0 18px}
.auth-card .btn{width:100%}
.auth-msg{margin-top:12px;font-size:12px;color:var(--red);min-height:16px}
</style>
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-logo">💰</div>
    <h2>Sổ Chi Tiêu</h2>
    <p>Đăng nhập Google để đồng bộ dữ liệu qua Google Drive.</p>
    <button id="btnSignIn" class="btn">Đăng nhập với Google</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="brand">💰 Sổ Chi Tiêu</div>
    <div class="sync-status" id="syncStatus">Đang tải dữ liệu…</div>
    <button id="btnRefresh">⟳ Làm mới</button>
    <button id="btnSignOut">Đăng xuất</button>
  </header>
  <div id="bannerZone"></div>
  <nav class="tabs">
    <button class="tab active" data-tab="sotay">Sổ tay</button>
    <button class="tab" data-tab="dongtien">Dòng tiền</button>
    <button class="tab" data-tab="vayno">Vay - Nợ</button>
    <button class="tab" data-tab="danhmuc">Danh mục</button>
  </nav>
  <main id="tabContent"><div class="empty">Đang tải…</div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
"use strict";

/* ---------------- Google OAuth + Drive data layer ---------------- */
var CLIENT_ID = '661285810864-b7pkfvt13fsnvu87g56e5f4qmoc74v22.apps.googleusercontent.com';
var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
var DRIVE_FILE_TITLE = 'chitieu-canhan-data.json';
var API_BASE = 'https://www.googleapis.com/drive/v3';
var UPLOAD_BASE = 'https://www.googleapis.com/upload/drive/v3';

var tokenClient = null;
var accessToken = null;

var DEFAULT_DATA = {
  settings: { soDuDauKy: 957000, ngayBatDau: "2026-09-25" },
  journal: {},
  categories: { thu: [
    { id: "luong", ten: "Lương", chiTieu: 0 },
    { id: "thuHoiChoVay", ten: "Thu hồi cho vay", chiTieu: 0 },
    { id: "nhanTienVay", ten: "Nhận tiền vay", chiTieu: 0, khongDuTru: true }
  ], chi: [
    { id: "an", ten: "Ăn", chiTieu: 0 },
    { id: "xang", ten: "Xăng", chiTieu: 0 },
    { id: "tieu", ten: "Tiêu", chiTieu: 0 },
    { id: "traNo", ten: "Trả nợ", chiTieu: 0 }
  ]},
  duTru: { thu: {}, chi: {} },
  vayNo: { choVay: [], vayNoPhaiTra: [] }
};

var state = {
  data: null,
  driveFileId: null,
  dirty: false,
  saving: false,
  loading: true,
  errorMsg: null,
  lastSync: null,
  tab: 'sotay',
  soTayMonth: null,   // "YYYY-MM"
  dongTienYear: null,
  editingDate: null,
};

function initTokenClient(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: function(){}
  });
}

function requestToken(interactive){
  return new Promise(function(resolve, reject){
    tokenClient.callback = function(resp){
      if (resp && resp.error){ reject(resp); return; }
      accessToken = resp.access_token;
      resolve(accessToken);
    };
    tokenClient.error_callback = function(err){ reject(err); };
    tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
  });
}

async function driveFetch(url, options, retried){
  options = options || {};
  var headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + accessToken });
  var res = await fetch(url, Object.assign({}, options, { headers: headers }));
  if (res.status === 401 && !retried){
    await requestToken(false);
    return driveFetch(url, options, true);
  }
  return res;
}

async function findFileId(){
  var q = encodeURIComponent("name='" + DRIVE_FILE_TITLE + "' and trashed=false");
  var url = API_BASE + '/files?q=' + q + '&fields=files(id,name,modifiedTime)&spaces=drive';
  var res = await driveFetch(url);
  if (!res.ok) throw new Error('search-failed:' + res.status);
  var json = await res.json();
  var files = json.files || [];
  if (!files.length) return null;
  files.sort(function(a,b){ return new Date(b.modifiedTime) - new Date(a.modifiedTime); });
  return files[0].id;
}

async function driveLoad(){
  try{
    var fileId = await findFileId();
    if (!fileId){
      state.data = normalizeData(JSON.parse(JSON.stringify(DEFAULT_DATA)));
      state.driveFileId = null;
      state.errorMsg = null;
      state.lastSync = new Date();
      state.loading = false;
      return;
    }
    var res = await driveFetch(API_BASE + '/files/' + fileId + '?alt=media');
    if (!res.ok) throw new Error('download-failed:' + res.status);
    var text = await res.text();
    var parsed = JSON.parse(text);
    state.data = normalizeData(parsed);
    state.driveFileId = fileId;
    state.errorMsg = null;
    state.lastSync = new Date();
  }catch(e){
    if (!state.data){
      state.data = normalizeData(JSON.parse(JSON.stringify(DEFAULT_DATA)));
      state.errorMsg = 'Không tải được dữ liệu từ Google Drive — đang dùng dữ liệu mặc định. Bấm "Làm mới" để thử lại.';
    } else {
      state.errorMsg = 'Làm mới thất bại, vẫn giữ dữ liệu hiện tại trên máy.';
    }
  }
  state.loading = false;
}

function normalizeData(d){
  d.settings = d.settings || { soDuDauKy: 0, ngayBatDau: "2026-01-01" };
  d.journal = d.journal || {};
  d.planItems = d.planItems || [];
  d.categories = d.categories || { thu: [], chi: [] };
  d.categories.thu = d.categories.thu || [];
  d.categories.chi = d.categories.chi || [];
  d.categories.thu.forEach(function(c){ if (c.chiTieu==null) c.chiTieu = 0; if (c.khongDuTru==null) c.khongDuTru = false; if (c.coDinhChiTieu==null) c.coDinhChiTieu = false; });
  d.categories.chi.forEach(function(c){ if (c.chiTieu==null) c.chiTieu = 0; if (c.khongDuTru==null) c.khongDuTru = false; if (c.coDinhChiTieu==null) c.coDinhChiTieu = false; });
  d.duTru = d.duTru || { thu: {}, chi: {} };
  d.duTru.thu = d.duTru.thu || {};
  d.duTru.chi = d.duTru.chi || {};
  d.vayNo = d.vayNo || { choVay: [], vayNoPhaiTra: [] };
  d.vayNo.choVay = d.vayNo.choVay || [];
  d.vayNo.vayNoPhaiTra = d.vayNo.vayNoPhaiTra || [];
  if (!d.categories.thu.some(function(c){ return c.id === 'thuHoiChoVay'; })){
    d.categories.thu.push({ id: 'thuHoiChoVay', ten: 'Thu hồi cho vay', chiTieu: 0 });
  }
  if (!d.categories.thu.some(function(c){ return c.id === 'nhanTienVay'; })){
    d.categories.thu.push({ id: 'nhanTienVay', ten: 'Nhận tiền vay', chiTieu: 0, khongDuTru: true });
  }
  // migrate dữ liệu cũ: thu là số đơn -> chuyển thành object theo danh mục (giữ nguyên tổng)
  Object.keys(d.journal).forEach(function(date){
    var e = d.journal[date];
    if (!e.thu || typeof e.thu !== 'object'){
      var oldVal = num(e.thu);
      e.thu = oldVal ? { _khac: oldVal } : {};
    }
    e.chi = e.chi || {};
  });
  return d;
}

function thuTotal(entry){
  var s = 0;
  var thu = entry.thu;
  if (thu && typeof thu === 'object'){
    Object.keys(thu).forEach(function(k){ s += num(thu[k]); });
  } else {
    s = num(thu);
  }
  return s;
}

var saveTimer = null;
function scheduleSave(){
  state.dirty = true;
  renderSyncStatus();
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(driveSave, 1500);
}

async function driveSave(){
  if (state.saving) { saveTimer = setTimeout(driveSave, 1500); return; }
  state.saving = true;
  renderSyncStatus();
  try{
    var text = JSON.stringify(state.data);
    if (!state.driveFileId){
      var createRes = await driveFetch(API_BASE + '/files', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: DRIVE_FILE_TITLE, mimeType: 'application/json' })
      });
      if (!createRes.ok) throw new Error('create-failed:' + createRes.status);
      var created = await createRes.json();
      state.driveFileId = created.id;
    }
    var upRes = await driveFetch(UPLOAD_BASE + '/files/' + state.driveFileId + '?uploadType=media', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: text
    });
    if (!upRes.ok) throw new Error('save-failed:' + upRes.status);
    state.errorMsg = null;
    state.lastSync = new Date();
  }catch(e){
    state.errorMsg = 'Lưu lên Google Drive thất bại. Sẽ thử lại.';
    saveTimer = setTimeout(driveSave, 4000);
  }
  state.dirty = false;
  state.saving = false;
  renderSyncStatus();
}

function isTypingNow(){
  var el = document.activeElement;
  return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
}

async function pollRefresh(){
  if (!accessToken || state.dirty || state.saving || isTypingNow()) return;
  await driveLoad();
  renderAll();
}

/* ---------------- auth flow ---------------- */
function showApp(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = '';
}
function showGate(msg){
  document.getElementById('app').style.display = 'none';
  document.getElementById('authGate').style.display = 'flex';
  document.getElementById('authMsg').textContent = msg || '';
}

var polling = false;
function startPolling(){
  if (polling) return;
  polling = true;
  window.addEventListener('focus', pollRefresh);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) pollRefresh(); });
  setInterval(pollRefresh, 35000);
}

async function signIn(){
  if (!window.google || !google.accounts || !google.accounts.oauth2){
    document.getElementById('authMsg').textContent = 'Đang tải Google Sign-In… thử lại sau 1-2 giây.';
    return;
  }
  if (!tokenClient) initTokenClient();
  document.getElementById('authMsg').textContent = 'Đang đăng nhập…';
  try{
    await requestToken(true);
    showApp();
    await driveLoad();
    renderAll();
    startPolling();
  }catch(e){
    showGate('Đăng nhập thất bại hoặc bị hủy. Thử lại.');
  }
}

function signOut(){
  if (accessToken && window.google && google.accounts && google.accounts.oauth2){
    google.accounts.oauth2.revoke(accessToken, function(){});
  }
  accessToken = null;
  state.data = null;
  showGate('');
}

/* ---------------- helpers ---------------- */
function fmt(n){ return (Number(n)||0).toLocaleString('vi-VN') + ' ₫'; }
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function monthKey(dateStr){ return dateStr.slice(0,7); }
var MONTH_NAMES = ['Th1','Th2','Th3','Th4','Th5','Th6','Th7','Th8','Th9','Th10','Th11','Th12'];
function monthLabel(mk){ var p=mk.split('-'); return 'Tháng ' + parseInt(p[1],10) + '/' + p[0]; }
// danh sách các tháng có giao dịch + tháng đang xem + tháng hiện tại, mới nhất trước
function soTayMonthList(){
  var set = {};
  sortedJournalDates().forEach(function(d){ set[monthKey(d)] = true; });
  set[state.soTayMonth] = true;
  set[monthKey(todayStr())] = true;
  return Object.keys(set).sort().reverse();
}
function slugify(s){
  var out = s.toString().toLowerCase()
    .replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g,'a').replace(/[èéẹẻẽêềếệểễ]/g,'e')
    .replace(/[ìíịỉĩ]/g,'i').replace(/[òóọỏõôồốộổỗơờớợởỡ]/g,'o')
    .replace(/[ùúụủũưừứựửữ]/g,'u').replace(/[ỳýỵỷỹ]/g,'y').replace(/đ/g,'d')
    .replace(/[^a-z0-9]+/g,'');
  return out || ('m' + Date.now());
}

function sortedJournalDates(){
  return Object.keys(state.data.journal).sort();
}
// các ngày được tính vào số dư: từ ngayBatDau (mốc khóa sổ) trở đi. Data trước mốc này
// vẫn còn nguyên trong journal (xem được ở Sổ tay, xuất Excel được) nhưng không cộng vào số dư nữa.
function balanceDates(){
  var start = state.data.settings.ngayBatDau || '';
  var dates = sortedJournalDates();
  return start ? dates.filter(function(d){ return d >= start; }) : dates;
}
function chiTotal(entry){
  var s = 0;
  var chi = entry.chi || {};
  Object.keys(chi).forEach(function(k){ s += num(chi[k]); });
  return s;
}
// balance at end of given date (inclusive), chỉ tính các phát sinh từ ngayBatDau trở đi
function balanceAt(dateStr){
  var bal = num(state.data.settings.soDuDauKy);
  var dates = balanceDates();
  for (var i=0;i<dates.length;i++){
    if (dates[i] > dateStr) break;
    var e = state.data.journal[dates[i]];
    bal += thuTotal(e) - chiTotal(e);
  }
  return bal;
}
function balanceBeforeMonth(mk){
  var firstDay = mk + '-01';
  var bal = num(state.data.settings.soDuDauKy);
  var dates = balanceDates();
  for (var i=0;i<dates.length;i++){
    if (dates[i] >= firstDay) break;
    var e = state.data.journal[dates[i]];
    bal += thuTotal(e) - chiTotal(e);
  }
  return bal;
}
// số dư tính tới hết tháng mk (cộng dồn toàn bộ lịch sử, không phụ thuộc năm đang xem)
function balanceAtEndOfMonth(mk){
  var p = mk.split('-'); var y = parseInt(p[0],10), m = parseInt(p[1],10) + 1;
  if (m > 12){ m = 1; y++; }
  return balanceBeforeMonth(y + '-' + pad2(m));
}

// xuất toàn bộ Sổ tay ra file Excel (dùng để backup thủ công)
function exportExcel(){
  var thuCats = state.data.categories.thu;
  var chiCats = state.data.categories.chi;
  var dates = sortedJournalDates();
  var header = ['Ngày'];

/* ---- Vay - Nợ ---- */
function monthKeyAdd(mk, n){
  var p = mk.split('-'); var y = parseInt(p[0],10), m = parseInt(p[1],10) + n;
  while (m > 12){ m -= 12; y++; }
  while (m < 1){ m += 12; y--; }
  return y + '-' + pad2(m);
}
function loanIsActive(loan){ return loan.trangThai !== 'da_tra_het'; }
// trả về lịch trả từng tháng: [{mk, goc, lai, tongTra, duNoConLai}]
function tinhLichTraNo(loan){
  var sch = [];
  var startMk = monthKey(loan.ngayVay || todayStr());
  var goc0 = num(loan.soTienGoc);
  if (loan.hinhThuc === 'tra_1_lan'){
    var mkDue = loan.ngayDaoHan ? monthKey(loan.ngayDaoHan) : monthKeyAdd(startMk, num(loan.soThangVay) || 0);
    sch.push({ mk: mkDue, goc: goc0, lai: 0, tongTra: goc0, duNoConLai: 0 });
    return sch;
  }
  var n = Math.max(1, num(loan.soThangVay));
  if (loan.hinhThuc === 'khong_lai'){
    var gocThang = goc0 / n, duNo = goc0;
    for (var i=1;i<=n;i++){
      duNo -= gocThang;
      sch.push({ mk: monthKeyAdd(startMk,i), goc: gocThang, lai: 0, tongTra: gocThang, duNoConLai: Math.max(0,duNo) });
    }
    return sch;
  }
  // co_lai — trả đều (annuity), lãi %/năm quy đổi tháng
  var r = num(loan.laiSuatNam) / 12 / 100;
  var duNo2 = goc0;
  if (r <= 0){
    var gocThang2 = goc0 / n;
    for (var j=1;j<=n;j++){
      duNo2 -= gocThang2;
      sch.push({ mk: monthKeyAdd(startMk,j), goc: gocThang2, lai: 0, tongTra: gocThang2, duNoConLai: Math.max(0,duNo2) });
    }
    return sch;
  }
  var pow = Math.pow(1+r, n);
  var pmt = goc0 * r * pow / (pow - 1);
  for (var k=1;k<=n;k++){
    var laiK = duNo2 * r, gocK = pmt - laiK;
    duNo2 -= gocK;
    sch.push({ mk: monthKeyAdd(startMk,k), goc: gocK, lai: laiK, tongTra: pmt, duNoConLai: Math.max(0,duNo2) });
  }
  return sch;
}
function conLaiPhaiThu(loan){
  return Math.max(0, num(loan.soTien) - num(loan.daThu));
}
// tháng dự kiến trả hết nợ (mk của dòng cuối lịch trả)
function thangDuKienHetNo(loan){
  var sch = tinhLichTraNo(loan);
  return sch.length ? sch[sch.length-1].mk : null;
}
// tiến độ trả nợ: tổng số kỳ, số kỳ đã trả (dựa theo daTraGoc thực tế), kỳ tiếp theo chưa trả (hoặc null nếu đã hết)
function tienDoTraNo(loan){
  var sch = tinhLichTraNo(loan);
  var daTra = num(loan.daTraGoc);
  var cum = 0, daTraKy = 0, kyTiepTheo = null;
  for (var i=0;i<sch.length;i++){
    cum += sch[i].goc;
    if (cum <= daTra + 0.01) daTraKy++;
    else if (!kyTiepTheo) kyTiepTheo = sch[i];
  }
  return { tongKy: sch.length, daTraKy: daTraKy, kyTiepTheo: kyTiepTheo };
}
// tổng số tiền còn phải trả (gồm cả lãi) của các kỳ chưa trả
function soTienConLaiPhaiTra(loan){
  var sch = tinhLichTraNo(loan);
  var daTraKy = tienDoTraNo(loan).daTraKy;
  var s = 0;
  for (var i = daTraKy; i < sch.length; i++) s += sch[i].tongTra;
  return s;
}
function tongTraNoThang(mk){
  var s = 0;
  (state.data.vayNo.vayNoPhaiTra||[]).forEach(function(loan){
    if (!loanIsActive(loan)) return;
    tinhLichTraNo(loan).forEach(function(row){ if (row.mk === mk) s += row.tongTra; });
  });
  return s;
}
function tongThuHoiThang(mk){
  var s = 0;
  (state.data.vayNo.choVay||[]).forEach(function(loan){
    if (loan.trangThai === 'da_thu_du') return;
    if (monthKey(loan.ngayDuKienThu || todayStr()) === mk){
      var cl = conLaiPhaiThu(loan);
      if (cl > 0) s += cl;
    }
  });
  return s;
}

// TB thực tế N tháng gần nhất có phát sinh (toàn bộ lịch sử), dùng làm gợi ý dự trù
function recentAvgActual(kind, catId, n){
  var byMonth = {};
  Object.keys(state.data.journal).forEach(function(d){
    var obj = state.data.journal[d][kind] || {};
    if (!obj[catId]) return;
    var mk = monthKey(d);
    byMonth[mk] = (byMonth[mk]||0) + num(obj[catId]);
  });
  var mks = Object.keys(byMonth).sort();
  var lastN = mks.slice(-n);
  if (!lastN.length) return null;
  var sum = lastN.reduce(function(s,mk){ return s+byMonth[mk]; },0);
  return sum/lastN.length;
}

var DONGTIEN_GROUPS = [ { kind:'thu', title:'Thu nhập' }, { kind:'chi', title:'Chi' } ];

function renderDongTien(){
  var root = document.getElementById('tabContent');
  if (!state.dongTienYear) state.dongTienYear = parseInt((state.data.settings.ngayBatDau||todayStr()).slice(0,4),10);
  var year = state.dongTienYear;
  var startMk = (state.data.settings.ngayBatDau||todayStr()).slice(0,7);
  var currentMk = monthKey(todayStr());
  // chỉ hiển thị các tháng từ mốc khóa sổ (ngayBatDau) trở đi — tháng trước đó không theo dõi Dòng tiền nữa
  var months = [];
  for (var m=1;m<=12;m++){
    var mk0 = year+'-'+pad2(m);
    if (mk0 >= startMk) months.push(mk0);
  }
  if (!months.length){
    root.innerHTML = '<div class="year-nav">'
      + '<button data-act="prevYear" class="icon-btn">‹</button>'
      + '<div class="lbl">'+year+'</div>'
      + '<button data-act="nextYear" class="icon-btn">›</button>'
      + '</div><div class="card"><div class="empty">Năm '+year+' không có tháng nào từ mốc khóa sổ ('+startMk+'). Bấm › để xem năm khác.</div></div>';
    return;
  }

  // thực tế = tổng theo danh mục/tháng lấy thẳng từ Sổ tay (chỉ năm đang xem)
  var actual = { thu:{}, chi:{} };
  ['thu','chi'].forEach(function(kind){
    state.data.categories[kind].forEach(function(c){ actual[kind][c.id] = {}; });
  });
  Object.keys(state.data.journal).forEach(function(d){
    if (d.slice(0,4) !== String(year)) return;
    var mk = monthKey(d);
    var e = state.data.journal[d];
    ['thu','chi'].forEach(function(kind){
      var obj = e[kind] || {};
      Object.keys(obj).forEach(function(cid){
        if (!actual[kind][cid]) actual[kind][cid] = {};
        actual[kind][cid][mk] = (actual[kind][cid][mk]||0) + num(obj[cid]);
      });
    });
  });

  function actualVal(kind, cid, mk){ return num((actual[kind][cid]||{})[mk]); }
  function baseVal(kind, cid){
    var cat = state.data.categories[kind].find(function(c){ return c.id===cid; });
    return cat ? num(cat.chiTieu) : 0;
  }
  // gợi ý: riêng "Trả nợ"/"Thu hồi cho vay" lấy thẳng từ lịch trả của module Vay-Nợ (không dùng TB 3 tháng nữa);
  // danh mục đánh dấu "Không dự trù" (khongDuTru) thì không đoán gì cả — luôn để trống ở tháng tương lai;
  // các danh mục khác vẫn TB thực tế 3 tháng gần nhất có phát sinh, nếu chưa có dữ liệu thì lấy chỉ tiêu
  function suggestVal(kind, cid, mk){
    var cat0 = state.data.categories[kind].find(function(c){ return c.id===cid; });
    if (cat0 && cat0.khongDuTru) return null;
    if (kind==='chi' && cid==='traNo') return tongTraNoThang(mk) || null;
    if (kind==='thu' && cid==='thuHoiChoVay') return tongThuHoiThang(mk) || null;
    if (cat0 && cat0.coDinhChiTieu){
      var bF = baseVal(kind, cid);
      return bF > 0 ? bF : null;
    }
    var avg = recentAvgActual(kind, cid, 3);
    if (avg != null) return avg;
    var b = baseVal(kind, cid);
    return b > 0 ? b : null;
  }
  // giá trị hiển thị cho 1 ô: tháng đã qua/hiện tại -> thực tế, tháng tương lai -> gợi ý
  function cellVal(kind, cid, mk){
    return (mk > currentMk) ? suggestVal(kind, cid, mk) : actualVal(kind, cid, mk);
  }
  function groupCell(kind, mk){
    var s = 0;
    state.data.categories[kind].forEach(function(c){ s += (cellVal(kind, c.id, mk) || 0); });
    return s;
  }

  var html = '<div class="year-nav">'
    + '<button data-act="prevYear" class="icon-btn">‹</button>'
    + '<div class="lbl">'+year+'</div>'
    + '<button data-act="nextYear" class="icon-btn">›</button>'
    + '</div>';

  html += '<div class="card"><div class="table-wrap table-wrap-year"><table><thead><tr><th class="sticky-col" style="min-width:170px">Khoản mục</th>';
  months.forEach(function(mk){ html += '<th class="dt-input th-month">Tháng '+parseInt(mk.slice(5,7),10)+(mk>currentMk?' *':'')+'</th>'; });
  html += '</tr></thead><tbody>';

  DONGTIEN_GROUPS.forEach(function(g){
    var cats = state.data.categories[g.kind];
    html += '<tr><td colspan="'+(months.length+1)+'" class="group-title">'+g.title+'</td></tr>';
    if (!cats.length){
      html += '<tr><td colspan="'+(months.length+1)+'" class="empty">Chưa có danh mục — thêm ở tab "Danh mục".</td></tr>';
    }
    cats.forEach(function(c){
      var base = baseVal(g.kind, c.id);
      var tagHtml = base>0 ? ' <span class="cat-tag" title="Chỉ tiêu/tháng">'+fmt(base)+'</span>' : '';
      html += '<tr><td class="sticky-col"><span class="cat-label">'+c.ten+tagHtml+'</span></td>';
      months.forEach(function(mk){
        var future = mk > currentMk;
        var val = cellVal(g.kind, c.id, mk);
        var showNum = future ? (val != null) : (!!val);
        var text = showNum ? fmt(Math.round(val)) : (future ? '—' : '');
        var cls = 'dt-input' + (future ? ' dt-suggest' : '');
        var style = '';
        if (showNum && base > 0){
          var bad = g.kind === 'chi' ? (val > base) : (val < base);
          style = ' style="color:'+(bad?'var(--red)':'var(--green)')+'"';
        }
        html += '<td class="'+cls+'"'+style+'>'+text+'</td>';
      });
      html += '</tr>';
    });
    html += '<tr class="total-row"><td class="sticky-col">Tổng '+g.title.toLowerCase()+'</td>';
    months.forEach(function(mk){ html += '<td>'+fmt(groupCell(g.kind,mk))+'</td>'; });
    html += '</tr>';
  });

  // cân đối + lũy kế
  html += '<tr class="balance-row"><td class="sticky-col">Cân đối tháng</td>';
  months.forEach(function(mk){ html += '<td>'+fmt(groupCell('thu',mk) - groupCell('chi',mk))+'</td>'; });
  html += '</tr>';

  html += '<tr class="balance-row"><td class="sticky-col">Lũy kế số dư</td>';
  months.forEach(function(mk){
    html += (mk < startMk) ? '<td>—</td>' : '<td>'+fmt(balanceAtEndOfMonth(mk))+'</td>';
  });
  html += '</tr>';

  html += '</tbody></table></div></div>';
  html += '<div class="empty" style="margin-top:-8px">* Tháng chưa tới: số liệu là gợi ý (TB thực tế 3 tháng gần nhất, hoặc chỉ tiêu nếu chưa có dữ liệu). Riêng "Trả nợ"/"Thu hồi cho vay" lấy thẳng từ lịch trả ở tab Vay - Nợ.</div>';

  // ---- Phân tích dòng tiền ----
  html += '<div class="card"><h3>Phân tích dòng tiền</h3>'
    + '<div class="empty" style="padding:0 0 10px">Chỉ tiêu lấy từ tab Danh mục. TB thực tế tính trên các tháng có phát sinh trong năm '+year+'. Gợi ý tháng tới = TB thực tế 3 tháng gần nhất có dữ liệu (toàn bộ lịch sử); nếu chưa có dữ liệu thì lấy theo chỉ tiêu. Riêng "Trả nợ"/"Thu hồi cho vay" lấy từ lịch trả ở tab Vay - Nợ.</div>'
    + '<div class="table-wrap"><table><thead><tr><th style="text-align:left">Danh mục</th><th>Chỉ tiêu/tháng</th><th>TB thực tế/tháng</th><th>Chênh lệch</th><th>Gợi ý tháng tới</th></tr></thead><tbody>';
  ['thu','chi'].forEach(function(kind){
    state.data.categories[kind].forEach(function(c){
      var sumA=0, cntA=0;
      months.forEach(function(mk){
        var av = actualVal(kind,c.id,mk);
        if (av){ sumA+=av; cntA++; }
      });
      var tbA = cntA ? sumA/cntA : null;
      var base = baseVal(kind, c.id);
      var diff = (tbA!=null && base>0) ? (tbA-base) : null;
      var diffStyle = '';
      if (diff!=null && diff!==0){
        var bad = kind==='chi' ? diff>0 : diff<0;
        diffStyle = ' style="color:'+(bad?'var(--red)':'var(--green)')+'"';
      }
      var goiY = suggestVal(kind, c.id, monthKeyAdd(currentMk, 1));
      html += '<tr>'
        + '<td style="text-align:left">'+c.ten+' <span class="cat-tag">'+(kind==='thu'?'thu':'chi')+'</span></td>'
        + '<td>'+(base>0?fmt(base):'—')+'</td>'
        + '<td>'+(tbA!=null?fmt(Math.round(tbA)):'—')+'</td>'
        + '<td'+diffStyle+'>'+(diff!=null?fmt(Math.round(diff)):'—')+'</td>'
        + '<td>'+(goiY!=null?fmt(Math.round(goiY)):'—')+'</td>'
        + '</tr>';
    });
  });
  html += '</tbody></table></div></div>';

  root.innerHTML = html;
}

/* ---- Vay - Nợ: render ---- */
var LOAI_VAY_LABEL = { ngan_hang:'Ngân hàng', vi:'Ví', ban_be:'Bạn bè', nguoi_than:'Người thân' };
var HINH_THUC_LABEL = { tra_1_lan:'Trả 1 lần', khong_lai:'Không lãi suất', co_lai:'Có lãi suất' };

function actualCatMonthAll(kind, mk){
  var s = 0;
  Object.keys(state.data.journal).forEach(function(d){
    if (monthKey(d) !== mk) return;
    var e = state.data.journal[d];
    s += (kind==='thu') ? thuTotal(e) : chiTotal(e);
  });
  return s;
}
function duTruDanhMucThang(kind, cid, mk){
  var cat0 = state.data.categories[kind].find(function(c){ return c.id===cid; });
  if (cat0 && cat0.khongDuTru) return 0;
  if (kind==='chi' && cid==='traNo') return tongTraNoThang(mk);
  if (kind==='thu' && cid==='thuHoiChoVay') return tongThuHoiThang(mk);
  if (cat0 && cat0.coDinhChiTieu) return num(cat0.chiTieu) > 0 ? num(cat0.chiTieu) : 0;
  var avg = recentAvgActual(kind, cid, 3);
  if (avg != null) return avg;
  var cat = state.data.categories[kind].find(function(c){ return c.id===cid; });
  return (cat && num(cat.chiTieu) > 0) ? num(cat.chiTieu) : 0;
}
function duTruThuThang(mk){
  var s=0; state.data.categories.thu.forEach(function(c){ s += duTruDanhMucThang('thu', c.id, mk); }); return s;
}
function duTruChiThang(mk){
  var s=0; state.data.categories.chi.forEach(function(c){ s += duTruDanhMucThang('chi', c.id, mk); }); return s;
}
function tongThuThangCard(mk){
  return (mk <= monthKey(todayStr())) ? actualCatMonthAll('thu', mk) : duTruThuThang(mk);
}
function tongChiThangCard(mk){
  return (mk <= monthKey(todayStr())) ? actualCatMonthAll('chi', mk) : duTruChiThang(mk);
}

function renderVayNo(){
  var root = document.getElementById('tabContent');

  var vayNoPhaiTra = state.data.vayNo.vayNoPhaiTra;

  html += '<div class="card"><h3 style="display:flex;align-items:center;justify-content:space-between">Cho vay <button class="btn sm" data-act="vnAddChoVay">+ Thêm khoản cho vay</button></h3>';

    html += '<div class="table-wrap"><table><thead><tr><th style="text-align:left">Tên</th><th>Số tiền</th><th>Đã thu</th><th>Còn lại</th><th>Dự kiến thu</th><th>Trạng thái</th><th class="actions-col"></th></tr></thead><tbody>';

    });

  }
  html += '</div>';

  html += '<div class="card"><h3 style="display:flex;align-items:center;justify-content:space-between">Vay - Nợ phải trả <button class="btn sm" data-act="vnAddVayNo">+ Thêm khoản vay</button></h3>';

    html += '<div class="empty">Chưa có khoản vay nào.</div>';

    html += '<div class="table-wrap"><table><thead><tr><th style="text-align:left">Tên</th><th>Loại vay</th><th>Hình thức</th><th>Đã trả</th><th>Dư nợ còn lại</th><th>Số tiền trả kỳ tới</th><th>Dự kiến hết nợ</th><th>Trạng thái</th><th class="actions-col"></th></tr></thead><tbody>';

      var hetNoMk = thangDuKienHetNo(v);
      var tienDo = tienDoTraNo(v);
      html += '<tr>'
        + '<td style="text-align:left"><a href="#" data-act="vnToggleDetail" data-id="'+v.id+'" style="color:var(--primary-d);text-decoration:none">'+v.ten+'</a></td>'
        + '<td>'+LOAI_VAY_LABEL[v.loaiVay]+'</td>'
        + '<td>'+HINH_THUC_LABEL[v.hinhThuc]+'</td>'

        + '<td>'+fmt(duNo)+'</td>'
        + '<td>'+(tienDo.kyTiepTheo ? fmt(Math.round(tienDo.kyTiepTheo.tongTra))+' ('+monthLabel(tienDo.kyTiepTheo.mk)+')' : '—')+'</td>'
        + '<td>'+(hetNoMk?monthLabel(hetNoMk):'—')+'</td>'

        + '<button class="icon-btn" data-act="vnEditVayNo" data-id="'+v.id+'">✎</button>'

    html += '</tbody></table></div>';

  var rowsData = months.map(function(mk){
    var thu = tongThuThangCard(mk), chi = tongChiThangCard(mk);

    + '</select></h3>';
  html += '<div class="empty" style="padding:0 0 10px">Tháng hiện tại/qua khứ dùng số thực tế từ Sổ tay; tháng tương lai dùng gợi ý (TB 3 tháng hoặc chỉ tiêu), riêng Trả nợ / Thu hồi cho vay lấy thẳng từ lịch vay ở trên.</div>';

    html += '<tr><td style="text-align:left">'+monthLabel(r.mk)+'</td><td style="color:var(--green)">'+fmt(Math.round(r.thu))+'</td><td style="color:var(--red)">'+fmt(Math.round(r.chi))+'</td><td>'+fmt(Math.round(r.bal))+'</td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<div class="chart-box" style="margin-top:10px"><canvas id="chartTichLuy"></canvas></div>';
  html += '</div>';

  root.innerHTML = html;
  drawTichLuyChart(rowsData);
}

function drawTichLuyChart(rowsData){
  if (chartTichLuy) chartTichLuy.destroy();
  var ctx = document.getElementById('chartTichLuy');
  if (!ctx) return;
  chartTichLuy = new Chart(ctx, { type:'line',
    data:{ labels: rowsData.map(function(r){ return monthLabel(r.mk); }), datasets:[
      { label:'Số dư lũy kế', data: rowsData.map(function(r){ return Math.round(r.bal); }), borderColor:'#4f46e5', backgroundColor:'rgba(79,70,229,.1)', fill:true, tension:.25 }
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ title:{display:true,text:'Số dư lũy kế dự kiến'}, legend:{display:false} }, scales:{ y:{ ticks:{ callback:function(v){ return v>=1000?(v/1000)+'k':v; } } } } }
  });
}

        + '<input type="checkbox" data-act="catNoForecast" data-kind="'+kind+'" data-id="'+c.id+'"'+(c.khongDuTru?' checked':'')+'> Không dự trù</label>'
        + '<label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap" title="Luôn dùng đúng số Chỉ tiêu/tháng cho các tháng tương lai, không lấy trung bình 3 tháng thực tế (dùng khi lương/chỉ tiêu vừa thay đổi)">'
        + '<input type="checkbox" data-act="catFixedTarget" data-kind="'+kind+'" data-id="'+c.id+'"'+(c.coDinhChiTieu?' checked':'')+'> Cố định theo Chỉ tiêu</label>'
        + '</div>';
    });
    html += '</div>';
  }
  html += '<button class="btn sm" data-act="addCat" data-kind="'+kind+'">+ Thêm danh mục</button>';
  html += '</div>';
  return html;
}

function renderDanhMuc(){
  var root = document.getElementById('tabContent');
  var html = '';
  html += categoryCardHtml('thu', 'Danh mục khoản thu', state.data.categories.thu);
  html += categoryCardHtml('chi', 'Danh mục khoản chi', state.data.categories.chi);
  html += '<div class="card"><h3>Số dư đầu kỳ</h3>'
    + '<div class="form-row">'
    + '<div><label>Ngày bắt đầu</label><input type="date" id="cfg_ngay" value="'+(state.data.settings.ngayBatDau||'')+'"></div>'
    + '<div><label>Số dư</label><input type="number" id="cfg_du" value="'+(state.data.settings.soDuDauKy||0)+'"></div>'
    + '</div><button class="btn sm" data-act="saveSettings">Lưu</button></div>';
  html += '<div class="card"><h3>Khóa sổ</h3>'
    + '<div class="empty" style="padding:0 0 10px">Chốt số dư đến hết tháng chọn bên dưới, dùng làm số dư đầu kỳ mới. Dữ liệu Sổ tay các tháng trước đó vẫn giữ nguyên để xem lại, chỉ không cộng vào số dư/Dòng tiền nữa.</div>'
    + '<div class="form-row">'
    + '<div><label>Khóa đến hết tháng</label><input type="month" id="cfg_khoa" value="'+monthKey(todayStr())+'"></div>'
    + '</div><button class="btn sm" data-act="lockMonth">Khóa sổ </button></div>';
  root.innerHTML = html;
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-act]');
  if (t){
    var act = t.getAttribute('data-act');
    handleAction(act, t, ev);
    return;
  }
  var tabBtn = ev.target.closest('.tab');
  if (tabBtn){
    state.tab = tabBtn.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b===tabBtn); });
    renderAll();
  }
});

document.getElementById('btnSignIn').addEventListener('click', signIn);
document.getElementById('btnSignOut').addEventListener('click', signOut);

document.getElementById('btnRefresh').addEventListener('click', async function(){
  state.errorMsg = null;
  await driveLoad();
  renderAll();
});

document.addEventListener('change', function(ev){
  var el = ev.target;
  if (el.matches('[data-act=jumpMonth]')){
    state.soTayMonth = el.value;
    renderSoTay();
  } else if (el.matches('[data-act=vnHorizonChange]')){
    state.vnHorizon = parseInt(el.value, 10);
    renderVayNo();
  } else if (el.matches('[data-act=catName]')){
    var kindC = el.getAttribute('data-kind') || 'chi';
    var c = state.data.categories[kindC].find(function(x){ return x.id===el.getAttribute('data-id'); });
    if (c){ c.ten = el.value; scheduleSave(); }
  } else if (el.matches('[data-act=catBase]')){
    var kindB = el.getAttribute('data-kind') || 'chi';
    var cB = state.data.categories[kindB].find(function(x){ return x.id===el.getAttribute('data-id'); });
    if (cB){ cB.chiTieu = num(el.value); scheduleSave(); }
  } else if (el.matches('[data-act=catNoForecast]')){
    var kindN = el.getAttribute('data-kind') || 'chi';
    var cN = state.data.categories[kindN].find(function(x){ return x.id===el.getAttribute('data-id'); });
    if (cN){ cN.khongDuTru = el.checked; scheduleSave(); }
  } else if (el.matches('[data-act=catFixedTarget]')){
    var kindF = el.getAttribute('data-kind') || 'chi';
    var cF = state.data.categories[kindF].find(function(x){ return x.id===el.getAttribute('data-id'); });
    if (cF){ cF.coDinhChiTieu = el.checked; scheduleSave(); }
  } else if (el.matches('[data-act=soTayChonChoVay]')){
    var cvId = el.value;
    var inpThu = document.querySelector('.f_thu[data-cat=thuHoiChoVay]');
    if (cvId && inpThu){
      var cvSel = state.data.vayNo.choVay.find(function(x){ return x.id===cvId; });
      if (cvSel) inpThu.value = Math.round(conLaiPhaiThu(cvSel));
    }
  } else if (el.matches('[data-act=soTayChonVayNo]')){
    var vnId = el.value;
    var inpChi = document.querySelector('.f_chi[data-cat=traNo]');
    if (vnId && inpChi){
      var vnSel = state.data.vayNo.vayNoPhaiTra.find(function(x){ return x.id===vnId; });
      if (vnSel){
        var tdSel = tienDoTraNo(vnSel);
        if (tdSel.kyTiepTheo) inpChi.value = Math.round(tdSel.kyTiepTheo.tongTra);
      }
    }
  }
});

function handleAction(act, el){
  if (act === 'prevMonth' || act === 'nextMonth'){
    var p = state.soTayMonth.split('-'); var y=parseInt(p[0],10), m=parseInt(p[1],10);
    m += (act==='nextMonth'?1:-1);
    if (m<1){m=12;y--;} if (m>12){m=1;y++;}
    state.soTayMonth = y+'-'+pad2(m);
    renderSoTay();
  } else if (act === 'saveEntry'){
    var date = document.getElementById('f_date').value || todayStr();
    var ghiChu = document.getElementById('f_ghichu').value;
    var wasEditing = !!state.editingDate;
    var selCV = document.getElementById('sotay_selChoVay');
    var selVN = document.getElementById('sotay_selVayNo');
    var cvIdSel = (!wasEditing && selCV) ? selCV.value : '';
    var vnIdSel = (!wasEditing && selVN) ? selVN.value : '';
    var thu = {};
    document.querySelectorAll('.f_thu').forEach(function(inp){
      var v = num(inp.value);
      if (v) thu[inp.getAttribute('data-cat')] = v;
    });
    var chi = {};
    document.querySelectorAll('.f_chi').forEach(function(inp){
      var v = num(inp.value);
      if (v) chi[inp.getAttribute('data-cat')] = v;
    });
    if (state.editingDate){
      state.data.journal[date] = { thu: thu, chi: chi, ghiChu: ghiChu };
    } else if (state.data.journal[date]){
      var existing = state.data.journal[date];
      existing.thu = (existing.thu && typeof existing.thu === 'object') ? existing.thu : {};
      Object.keys(thu).forEach(function(cid){
        existing.thu[cid] = num(existing.thu[cid]) + thu[cid];
      });
      existing.chi = existing.chi || {};
      Object.keys(chi).forEach(function(cid){
        existing.chi[cid] = num(existing.chi[cid]) + chi[cid];
      });
      if (ghiChu) existing.ghiChu = existing.ghiChu ? (existing.ghiChu + '; ' + ghiChu) : ghiChu;
    } else {
      state.data.journal[date] = { thu: thu, chi: chi, ghiChu: ghiChu };
    }
    if (cvIdSel && thu['thuHoiChoVay']){
      var cvApply = state.data.vayNo.choVay.find(function(x){ return x.id===cvIdSel; });
      if (cvApply){
        cvApply.daThu = num(cvApply.daThu) + thu['thuHoiChoVay'];
        if (cvApply.daThu >= cvApply.soTien - 0.01) cvApply.trangThai = 'da_thu_du';
      }
    }
    if (vnIdSel){
      var vnApply = state.data.vayNo.vayNoPhaiTra.find(function(x){ return x.id===vnIdSel; });
      if (vnApply){
        var tdApply = tienDoTraNo(vnApply);
        if (tdApply.kyTiepTheo){
          vnApply.daTraGoc = num(vnApply.daTraGoc) + tdApply.kyTiepTheo.goc;
          if (vnApply.daTraGoc >= vnApply.soTienGoc - 0.01) vnApply.trangThai = 'da_tra_het';
        }
      }
    }
    state.editingDate = null;
    scheduleSave();
    renderSoTay();
  } else if (act === 'cancelEdit'){
    state.editingDate = null;
    renderSoTay();
  } else if (act === 'editDay'){
    state.editingDate = el.getAttribute('data-date');
    renderSoTay();
    window.scrollTo({top:0, behavior:'smooth'});
  } else if (act === 'delDay'){
    var d = el.getAttribute('data-date');
    if (confirm('Xóa giao dịch ngày '+d+'?')){
      delete state.data.journal[d];
      scheduleSave();
      renderSoTay();
    }
  } else if (act === 'exportExcel'){
    exportExcel();
  } else if (act === 'prevYear' || act === 'nextYear'){
    state.dongTienYear += (act==='nextYear'?1:-1);
    renderDongTien();
  } else if (act === 'addCat'){
    var kind = el.getAttribute('data-kind') || 'chi';
    var name2 = prompt('Tên danh mục mới:');
    if (name2 && name2.trim()){
      state.data.categories[kind].push({ id: slugify(name2)+'_'+Date.now().toString(36), ten: name2.trim() });
      scheduleSave();
      renderDanhMuc();
    }
  } else if (act === 'delCat'){
    var kind2 = el.getAttribute('data-kind') || 'chi';
    var cid = el.getAttribute('data-id');
    if (confirm('Xóa danh mục này? (giao dịch cũ vẫn giữ nguyên số liệu)')){
      state.data.categories[kind2] = state.data.categories[kind2].filter(function(x){return x.id!==cid;});
      scheduleSave();
      renderDanhMuc();
    }
  } else if (act === 'saveSettings'){
    state.data.settings.ngayBatDau = document.getElementById('cfg_ngay').value;
    state.data.settings.soDuDauKy = num(document.getElementById('cfg_du').value);
    scheduleSave();
    renderDanhMuc();
    alert('Đã lưu.');
  } else if (act === 'lockMonth'){
    var mk3 = document.getElementById('cfg_khoa').value;
    if (!mk3){ alert('Chọn tháng cần khóa sổ.'); return; }
    var newBal = balanceAtEndOfMonth(mk3);
    var p3 = mk3.split('-'); var ny = parseInt(p3[0],10), nm = parseInt(p3[1],10) + 1;
    if (nm > 12){ nm = 1; ny++; }
    var newStart = ny + '-' + pad2(nm) + '-01';
    if (!confirm('Khóa sổ đến hết '+monthLabel(mk3)+'?\nSố dư đầu kỳ mới: '+fmt(newBal)+'\nNgày bắt đầu mới: '+newStart+'\n\nDữ liệu Sổ tay cũ vẫn giữ nguyên, chỉ không tính vào số dư/Dòng tiền nữa.')) return;
    state.data.settings.ngayBatDau = newStart;
    state.data.settings.soDuDauKy = newBal;
    scheduleSave();
    renderDanhMuc();
    alert('Đã khóa sổ đến hết '+monthLabel(mk3)+'.');
  } else if (act === 'vnAddChoVay'){
    state.vnFormKind = 'choVay'; state.vnFormId = null; renderVayNo();
  } else if (act === 'vnAddVayNo'){
    state.vnFormKind = 'vayNoPhaiTra'; state.vnFormId = null; renderVayNo();
  } else if (act === 'vnCancelForm'){
    state.vnFormKind = null; state.vnFormId = null; renderVayNo();
  } else if (act === 'vnEditChoVay'){
    state.vnFormKind = 'choVay'; state.vnFormId = el.getAttribute('data-id'); renderVayNo();
  } else if (act === 'vnEditVayNo'){
    state.vnFormKind = 'vayNoPhaiTra'; state.vnFormId = el.getAttribute('data-id'); renderVayNo();
  } else if (act === 'vnSaveChoVay'){
    var tenCV = document.getElementById('vn_cv_ten').value.trim();
    if (!tenCV){ alert('Nhập tên khoản cho vay.'); return; }
    var objCV = {
      ten: tenCV,
      soTien: num(document.getElementById('vn_cv_soTien').value),
      ngayChoVay: document.getElementById('vn_cv_ngay').value || todayStr(),
      ngayDuKienThu: document.getElementById('vn_cv_ngayThu').value || ''
    };
    if (state.vnFormId){
      var oldCV = state.data.vayNo.choVay.find(function(x){ return x.id===state.vnFormId; });
      Object.assign(oldCV, objCV);
    } else {
      objCV.id = 'cv_' + slugify(tenCV) + '_' + Date.now().toString(36);
      objCV.daThu = 0;
      objCV.trangThai = 'dang_cho';
      state.data.vayNo.choVay.push(objCV);
    }
    state.vnFormKind = null; state.vnFormId = null;
    scheduleSave(); renderVayNo();
  } else if (act === 'vnSaveVayNo'){
    var tenVN = document.getElementById('vn_vn_ten').value.trim();
    if (!tenVN){ alert('Nhập tên khoản vay.'); return; }
    var hinh = document.getElementById('vn_vn_hinh').value;
    var objVN = {
      ten: tenVN,
      loaiVay: document.getElementById('vn_vn_loai').value,
      hinhThuc: hinh,
      soTienGoc: num(document.getElementById('vn_vn_soTien').value),
      ngayVay: document.getElementById('vn_vn_ngay').value || todayStr(),
      soThangVay: num(document.getElementById('vn_vn_soThang').value),
      ngayDaoHan: document.getElementById('vn_vn_daoHan').value || '',
      laiSuatNam: num(document.getElementById('vn_vn_laiSuat').value)
    };
    if (hinh === 'tra_1_lan' && !objVN.ngayDaoHan && !objVN.soThangVay){
      alert('Nhập ngày đáo hạn hoặc kỳ hạn (số tháng) cho khoản vay trả 1 lần.'); return;
    }
    if (hinh !== 'tra_1_lan' && !objVN.soThangVay){
      alert('Nhập kỳ hạn (số tháng) trả.'); return;
    }
    var daTraKyInput = Math.max(0, Math.floor(num(document.getElementById('vn_vn_daTraKy').value)));
    var schVN = tinhLichTraNo(objVN);
    daTraKyInput = Math.min(daTraKyInput, schVN.length);
    var daTraGocCalc = 0;
    for (var iDK=0; iDK<daTraKyInput; iDK++) daTraGocCalc += schVN[iDK].goc;
    objVN.daTraGoc = daTraGocCalc;
    if (objVN.daTraGoc >= objVN.soTienGoc && objVN.soTienGoc > 0) objVN.trangThai = 'da_tra_het';
    if (state.vnFormId){
      var oldVN = state.data.vayNo.vayNoPhaiTra.find(function(x){ return x.id===state.vnFormId; });
      Object.assign(oldVN, objVN);
    } else {
      objVN.id = 'vn_' + slugify(tenVN) + '_' + Date.now().toString(36);
      objVN.trangThai = objVN.trangThai || 'dang_vay';
      state.data.vayNo.vayNoPhaiTra.push(objVN);
      if (objVN.soTienGoc > 0){
        var dateVN = objVN.ngayVay || todayStr();
        var eVN = state.data.journal[dateVN] || { thu:{}, chi:{}, ghiChu:'' };
        eVN.thu = eVN.thu || {};
        eVN.thu['nhanTienVay'] = num(eVN.thu['nhanTienVay']) + objVN.soTienGoc;
        eVN.ghiChu = eVN.ghiChu ? (eVN.ghiChu + '; Nhận tiền vay: '+objVN.ten) : ('Nhận tiền vay: '+objVN.ten);
        state.data.journal[dateVN] = eVN;
      }
    }
    state.vnFormKind = null; state.vnFormId = null;
    scheduleSave(); renderVayNo();
  } else if (act === 'vnDelChoVay'){
    var idDC = el.getAttribute('data-id');
    if (confirm('Xóa khoản cho vay này?')){
      state.data.vayNo.choVay = state.data.vayNo.choVay.filter(function(x){ return x.id!==idDC; });
      scheduleSave(); renderVayNo();
    }
  } else if (act === 'vnDelVayNo'){
    var idDV = el.getAttribute('data-id');
    if (confirm('Xóa khoản vay này?')){
      state.data.vayNo.vayNoPhaiTra = state.data.vayNo.vayNoPhaiTra.filter(function(x){ return x.id!==idDV; });
      scheduleSave(); renderVayNo();
    }
  } else if (act === 'vnToggleDetail'){
    var idTD = el.getAttribute('data-id');
    state.vnDetailId = (state.vnDetailId === idTD) ? null : idTD;
    renderVayNo();
  } else if (act === 'vnGhiNhanThu'){
    var idGT = el.getAttribute('data-id');
    var cvItem = state.data.vayNo.choVay.find(function(x){ return x.id===idGT; });
    if (!cvItem) return;
    var conLaiGT = conLaiPhaiThu(cvItem);
    var amtStr = prompt('Số tiền đã thu được (còn phải thu: '+fmt(conLaiGT)+'):', conLaiGT);
    if (amtStr === null) return;
    var amt = num(amtStr);
    if (amt <= 0) return;
    cvItem.daThu = num(cvItem.daThu) + amt;
    if (cvItem.daThu >= cvItem.soTien - 0.01) cvItem.trangThai = 'da_thu_du';
    var dateGT = todayStr();
    var eGT = state.data.journal[dateGT] || { thu:{}, chi:{}, ghiChu:'' };
    eGT.thu = eGT.thu || {};
    eGT.thu['thuHoiChoVay'] = num(eGT.thu['thuHoiChoVay']) + amt;
    eGT.ghiChu = eGT.ghiChu ? (eGT.ghiChu + '; Thu hồi: '+cvItem.ten) : ('Thu hồi: '+cvItem.ten);
    state.data.journal[dateGT] = eGT;
    scheduleSave(); renderVayNo();
  } else if (act === 'vnGhiNhanTra'){
    var idGTr = el.getAttribute('data-id');
    var vnItem = state.data.vayNo.vayNoPhaiTra.find(function(x){ return x.id===idGTr; });
    if (!vnItem) return;
    var gocKy = num(el.getAttribute('data-goc'));
    var tongKy = num(el.getAttribute('data-tong'));
    var amtStr2 = prompt('Số tiền trả kỳ này (gợi ý: '+fmt(Math.round(tongKy))+'):', Math.round(tongKy));
    if (amtStr2 === null) return;
    var amt2 = num(amtStr2);
    if (amt2 <= 0) return;
    vnItem.daTraGoc = num(vnItem.daTraGoc) + gocKy;
    if (vnItem.daTraGoc >= vnItem.soTienGoc - 0.01) vnItem.trangThai = 'da_tra_het';
    var dateGTr = todayStr();
    var eGTr = state.data.journal[dateGTr] || { thu:{}, chi:{}, ghiChu:'' };
    eGTr.chi = eGTr.chi || {};
    eGTr.chi['traNo'] = num(eGTr.chi['traNo']) + amt2;
    eGTr.ghiChu = eGTr.ghiChu ? (eGTr.ghiChu + '; Trả nợ: '+vnItem.ten) : ('Trả nợ: '+vnItem.ten);
    state.data.journal[dateGTr] = eGTr;
    scheduleSave(); renderVayNo();
  } else if (act === 'vnTatToan'){
    var idTT = el.getAttribute('data-id');
    var vnTT = state.data.vayNo.vayNoPhaiTra.find(function(x){ return x.id===idTT; });
    if (!vnTT) return;
    var amtStrTT = prompt('Số tiền tất toán khoản "'+vnTT.ten+'" (nhập đúng số ngân hàng/bên cho vay báo, có thể khác số dư nợ lý thuyết):', '');
    if (amtStrTT === null) return;
    var amtTT = num(amtStrTT);
    if (amtTT <= 0){ alert('Nhập số tiền tất toán hợp lệ.'); return; }
    vnTT.daTraGoc = vnTT.soTienGoc;
    vnTT.trangThai = 'da_tra_het';
    var dateTT = todayStr();
    var eTT = state.data.journal[dateTT] || { thu:{}, chi:{}, ghiChu:'' };
    eTT.chi = eTT.chi || {};
    eTT.chi['traNo'] = num(eTT.chi['traNo']) + amtTT;
    eTT.ghiChu = eTT.ghiChu ? (eTT.ghiChu + '; Tất toán: '+vnTT.ten) : ('Tất toán: '+vnTT.ten);
    state.data.journal[dateTT] = eTT;
    scheduleSave(); renderVayNo();
  }
}

showGate('');

})();
