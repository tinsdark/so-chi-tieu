<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Chi Tiêu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-logo">💰</div>
    <h2>Sổ Chi Tiêu</h2>
    <p>Đăng nhập Google để đồng bộ dữ liệu qua Google Drive.</p>
    <button id="btnSignIn" class="btn">Đăng nhập với Google</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="brand">💰 Sổ Chi Tiêu</div>
    <div class="sync-status" id="syncStatus">Đang tải dữ liệu…</div>
    <button id="btnRefresh">⟳ Làm mới</button>
    <button id="btnSignOut">Đăng xuất</button>
  </header>
  <div id="bannerZone"></div>
  <nav class="tabs">
    <button class="tab active" data-tab="sotay">Sổ tay</button>
    <button class="tab" data-tab="dongtien">Dòng tiền</button>
    <button class="tab" data-tab="vayno">Vay - Nợ</button>
    <button class="tab" data-tab="danhmuc">Danh mục</button>
  </nav>
  <main id="tabContent"><div class="empty">Đang tải…</div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="js/state.js"></script>
<script src="js/drive-sync.js"></script>
<script src="js/vayno.js"></script>
<script src="js/sotay.js"></script>
<script src="js/danhmuc.js"></script>
<script src="js/dongtien.js"></script>
<script src="js/app.js"></script>

</body>
</html>
